[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quantumuav-risk"
version = "1.0.0"
description = "Reproducible quantum-aware temporal graph UAV security risk research framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "networkx>=3.0", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6.0"]
[project.optional-dependencies]
test = ["pytest>=7"]
parquet = ["pyarrow>=12"]
sitl = ["pymavlink>=2.4"]
[project.scripts]
quantumuav = "quantumuav.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
